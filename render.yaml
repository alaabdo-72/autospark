services:
  - type: web
    name: autospark-api
    env: node
    plan: free
    rootDir: autospark-api
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: autospark-web
    env: static
    plan: free
    rootDir: autospark-web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://autospark-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
